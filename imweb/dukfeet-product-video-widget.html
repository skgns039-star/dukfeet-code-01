<!-- =====================================================================
  DUKFEET 상품 영상 히어로 섹션 (아임웹 코드 위젯 전체 붙여넣기용)
  - 영상 단독: 로고/포스터/인트로 이미지·애니메이션 전부 제거
  - 16:9 고정, 화면 가로폭 풀폭(full-bleed), 좌우/상하 여백 없음
  - 검은 상하 띠는 원본 재인코딩 없이 CSS scale 크롭으로 가림(비율 왜곡 없음)
  - autoplay / muted / loop / playsinline / 컨트롤 숨김
  - 외부 라이브러리 없음. 전역 스타일 비침투(고유 클래스 dukfeet-hero-video)
====================================================================== -->

<section class="dukfeet-hero-video" aria-label="DUKFEET 핸드메이드 가죽 신발 착용 영상">
  <div class="dukfeet-hero-video__frame">
    <video
      class="dukfeet-hero-video__media"
      src="https://skgns039-star.github.io/dukfeet-code-01/videos/dukfeet-product-model-video.mp4?v=1"
      autoplay
      muted
      loop
      playsinline
      webkit-playsinline
      preload="auto"
      disablepictureinpicture
      aria-label="DUKFEET 핸드메이드 가죽 신발의 착화 모습과 움직임을 보여주는 모델 영상">
    </video>
  </div>
</section>

<style>
  /* ── 크롭/위치 조절 변수 (검은 띠가 남으면 값 ↑, 좌우 많이 잘리면 값 ↓) ── */
  .dukfeet-hero-video {
    --dukfeet-video-scale-desktop: 1.12;  /* PC 검은 띠 크롭 배율 */
    --dukfeet-video-scale-tablet: 1.11;   /* 태블릿 */
    --dukfeet-video-scale-mobile: 1.10;   /* 모바일 */
    --dukfeet-video-position-x: 50%;      /* 피사체 좌우 치우침 보정 */
    --dukfeet-video-position-y: 50%;      /* 피사체 상하 치우침 보정 */
  }

  .dukfeet-hero-video,
  .dukfeet-hero-video * { box-sizing: border-box; }

  /* full-bleed: 부모 컨테이너 폭과 무관하게 화면 가로폭을 꽉 채움 */
  .dukfeet-hero-video {
    position: relative;
    width: 100vw;
    margin-left: calc(50% - 50vw);   /* 가운데 정렬 풀폭 */
    margin-right: calc(50% - 50vw);
    margin-top: 0;
    margin-bottom: 0;
    padding: 0;
    overflow: hidden;                /* 가로 스크롤/넘침 방지 */
    line-height: 0;                  /* 영상 하단 미세 여백 제거 */
    background: #000;
  }

  /* 16:9 프레임 (padding-bottom 기법 → 모든 브라우저 호환) */
  .dukfeet-hero-video__frame {
    position: relative;
    width: 100%;
    height: 0;
    padding-bottom: 56.25%;          /* 9 / 16 = 0.5625 → 항상 16:9 */
    overflow: hidden;                /* 크롭된 검은 띠를 프레임 밖으로 */
    background: #000;
  }

  /* 영상: 프레임을 꽉 채움 + 비율 유지(왜곡 금지) + scale로 띠 크롭 */
  .dukfeet-hero-video__media {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
    border: 0;
    object-fit: cover;               /* 비율 유지하며 채움(fill 아님) */
    object-position: var(--dukfeet-video-position-x) var(--dukfeet-video-position-y);
    transform: scale(var(--dukfeet-video-scale-desktop));
    transform-origin: center center;
    background: #000;
    pointer-events: none;            /* 컨트롤/클릭 비활성(장식 배경) */
  }

  /* 태블릿 */
  @media (max-width: 1024px) {
    .dukfeet-hero-video__media { transform: scale(var(--dukfeet-video-scale-tablet)); }
  }
  /* 모바일 */
  @media (max-width: 767px) {
    .dukfeet-hero-video__media { transform: scale(var(--dukfeet-video-scale-mobile)); }
  }
</style>

<script>
(function () {
  "use strict";

  function setup(video) {
    if (video.__dukfeetHeroInit) return;
    video.__dukfeetHeroInit = true;

    /* 자동재생 필수 속성 강제(아임웹/모바일 정책 대비) */
    video.muted = true;
    video.defaultMuted = true;
    video.loop = true;
    video.playsInline = true;
    video.setAttribute('muted', '');
    video.setAttribute('playsinline', '');
    video.setAttribute('webkit-playsinline', '');

    function play() {
      var p;
      try { p = video.play(); } catch (e) { return; }
      if (p && typeof p.then === 'function') { p.then(function () {}).catch(function () {}); }
    }

    play();
    video.addEventListener('canplay', play);
    video.addEventListener('loadeddata', play);

    /* 탭 재활성화/첫 상호작용 시 재생 재시도(자동재생 차단 대비) */
    document.addEventListener('visibilitychange', function () { if (!document.hidden) play(); });
    ['touchstart', 'click'].forEach(function (ev) {
      window.addEventListener(ev, function once() { play(); window.removeEventListener(ev, once); }, { once: true, passive: true });
    });
  }

  function init() {
    var vids = document.querySelectorAll('.dukfeet-hero-video__media');
    for (var i = 0; i < vids.length; i++) setup(vids[i]);
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
  else init();
  /* 아임웹 지연 렌더링 대비 */
  setTimeout(init, 500);
  setTimeout(init, 1500);
})();
</script>
