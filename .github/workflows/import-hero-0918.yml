name: Import verified 0918 hero video

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/import-hero-0918.yml'

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Restore exact original container and publish verified video
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import base64, hashlib, json, lzma, os, pathlib, struct, subprocess, tempfile, urllib.request

          repo = 'https://api.github.com/repos/skgns039-star/dukfeet-code-01'
          headers = {'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json', 'User-Agent': 'DUKFEET-media-import', 'X-GitHub-Api-Version': '2022-11-28'}
          def api(path):
              with urllib.request.urlopen(urllib.request.Request(repo+path, headers=headers), timeout=90) as response:
                  return json.load(response)

          source_url = 'https://d2ol7oe51mr4n9.cloudfront.net/user_3J6HQ3YtbRrcEOHwI6pcQFCHglN/405b72cb-4fbb-4215-9576-086392ea7b2c.mp4'
          with urllib.request.urlopen(source_url, timeout=90) as response:
              source = response.read(55243390)
          if len(source) != 55243389 or hashlib.sha256(source).hexdigest() != '1fbbbfc8606aff3e48356767396a7df50ae1c836f6b310623867ceb5a85e11b5':
              raise RuntimeError('Unexpected transport bytes; no live changes')

          # The transfer service remuxes metadata. Restore original container
          # and original packet placement. No media encoder is used.
          metadata = api('/git/blobs/0fe07d3cd717aa37685be008b3d674f3c92734de')
          patch = lzma.decompress(base64.b64decode(metadata['content']))
          if len(patch) != 33348:
              raise RuntimeError('Unexpected original container metadata')

          def boxes(buf, start=0, end=None):
              end = len(buf) if end is None else end
              while start+8 <= end:
                  size,kind = struct.unpack_from('>I4s',buf,start)
                  header = 8
                  if size == 1:
                      size = struct.unpack_from('>Q',buf,start+8)[0]
                      header = 16
                  elif size == 0:
                      size = end-start
                  if size < header or start+size > end:
                      raise ValueError('Invalid MP4 box')
                  yield kind,start+header,start+size
                  start += size
          def child(buf,region,kind):
              for k,a,b in boxes(buf,*region):
                  if k == kind:
                      return a,b
              raise ValueError('Missing MP4 box '+str(kind))
          def locations(buf):
              result = {}
              for k,a,b in boxes(buf,*child(buf,(0,len(buf)),b'moov')):
                  if k != b'trak':
                      continue
                  mdia = child(buf,(a,b),b'mdia')
                  hdlr = child(buf,mdia,b'hdlr')[0]
                  handler = bytes(buf[hdlr+8:hdlr+12]).decode('ascii')
                  if handler in result:
                      raise ValueError('Ambiguous tracks')
                  stbl = child(buf,child(buf,mdia,b'minf'),b'stbl')
                  tables = {k:(x,y) for k,x,y in boxes(buf,*stbl)}
                  pos = tables[b'stsz'][0]
                  fixed,count = struct.unpack_from('>II',buf,pos+4)
                  sizes = [fixed]*count if fixed else list(struct.unpack_from('>'+str(count)+'I',buf,pos+12))
                  pos = tables[b'stsc'][0]
                  n = struct.unpack_from('>I',buf,pos+4)[0]
                  runs = [struct.unpack_from('>III',buf,pos+8+i*12) for i in range(n)]
                  key = b'stco' if b'stco' in tables else b'co64'
                  pos = tables[key][0]
                  n = struct.unpack_from('>I',buf,pos+4)[0]
                  fmt,width = ('I',4) if key == b'stco' else ('Q',8)
                  offsets = [struct.unpack_from('>'+fmt,buf,pos+8+i*width)[0] for i in range(n)]
                  locs = []
                  sample = run = 0
                  for ci,offset in enumerate(offsets,1):
                      while run+1 < len(runs) and ci >= runs[run+1][0]:
                          run += 1
                      for _ in range(runs[run][1]):
                          size = sizes[sample]
                          locs.append((offset,size))
                          offset += size
                          sample += 1
                  if sample != count:
                      raise ValueError('Sample count mismatch')
                  result[handler] = locs
              return result

          size = 55232948
          sha256 = 'b628a17ed4cd99e4b24e863644ce74336621eb8dc8ffab0277c6c1b7a5750b86'
          expected_blob = 'a136e78da5206cee00431bcd0b7ecf5744d15302'
          target = bytearray(size)
          target[:48] = patch[:48]
          target[-len(patch[48:]):] = patch[48:]
          src,dst = locations(source),locations(target)
          if src.keys() != dst.keys():
              raise ValueError('Track mismatch')
          for track in src:
              if len(src[track]) != len(dst[track]):
                  raise ValueError('Packet count mismatch')
              for (sp,ss),(tp,ts) in zip(src[track],dst[track]):
                  if ss != ts or sp+ss > len(source) or tp+ts > len(target):
                      raise ValueError('Packet bounds mismatch')
                  target[tp:tp+ts] = source[sp:sp+ss]
          data = bytes(target)
          if len(data) != size or hashlib.sha256(data).hexdigest() != sha256:
              raise RuntimeError('Original attachment hash mismatch; abort')
          print('ORIGINAL_BYTE_FOR_BYTE_VERIFIED='+sha256, flush=True)

          # Use Git transport for the 55 MB file. Read the existing tree first
          # and replace only the two existing video paths, atomically.
          auth = base64.b64encode(('x-access-token:'+os.environ['GH_TOKEN']).encode()).decode()
          env = os.environ.copy()
          env.update({'GIT_TERMINAL_PROMPT':'0','GIT_CONFIG_COUNT':'1','GIT_CONFIG_KEY_0':'http.https://github.com/.extraheader','GIT_CONFIG_VALUE_0':'AUTHORIZATION: basic '+auth})
          with tempfile.TemporaryDirectory() as work:
              def git(*args, input=None):
                  completed = subprocess.run(['git','-C',work,*args], env=env, input=input, text=True, stdout=subprocess.PIPE, stderr=subprocess.PIPE, timeout=180)
                  if completed.returncode:
                      raise RuntimeError('Git operation failed: '+completed.stderr.replace(auth,'[redacted]').replace(os.environ['GH_TOKEN'],'[redacted]'))
                  return completed.stdout.strip()
              git('init','--quiet')
              git('remote','add','origin','https://github.com/skgns039-star/dukfeet-code-01.git')
              git('fetch','--depth=1','origin','main')
              parent = git('rev-parse','FETCH_HEAD')
              git('read-tree',parent)
              git('config','user.name','github-actions[bot]')
              git('config','user.email','41898282+github-actions[bot]@users.noreply.github.com')
              file = pathlib.Path(work)/'0918-original.mp4'
              file.write_bytes(data)
              blob = git('hash-object','-w',str(file))
              if blob != expected_blob:
                  raise RuntimeError('Git blob hash mismatch')
              for path in ['videos/dukfeet-product-model-video.mp4','videos/dukfeet-product-model-video-v2.mp4']:
                  git('update-index','--add','--cacheinfo','100644,'+blob+','+path)
              tree = git('write-tree')
              commit = git('commit-tree',tree,'-p',parent,'-m','Replace hero video with byte-identical 0918.mp4')
              git('push','origin',commit+':refs/heads/main')
              print('VIDEO_COMMIT='+commit, flush=True)
          print('VERIFIED_VIDEO_BLOB='+expected_blob)
          print('VERIFIED_VIDEO_SIZE='+str(size))
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a',encoding='utf-8') as summary:
              summary.write('0918.mp4 published byte-for-byte to both existing video URLs. No encoding.\n\n')
              summary.write('Size: '+str(size)+'\n\nSHA-256: '+sha256+'\n\nBlob: '+expected_blob+'\n\nCommit: '+commit+'\n')
              summary.write('\nPage code is unchanged; a separate verified code commit will trigger Pages.\n')
          PY
